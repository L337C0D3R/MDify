<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MDify</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --border: #d1d9e0;
      --surface: #f6f8fa;
      --accent: #4F46E5;
      --brand: linear-gradient(135deg, #4F46E5, #9333EA);
      --warn-bg: #fff8c5;
      --warn-border: #d4a72c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #f0f6fc;
        --muted: #9198a1;
        --border: #3d444d;
        --surface: #151b23;
        --accent: #818CF8;
        --warn-bg: #2e2a1a;
        --warn-border: #9e6a03;
      }
    }
    body {
      margin: 0;
      width: 280px;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    h1 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    h1 img { width: 28px; height: 28px; }
    h1 .ify {
      background: var(--brand);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    @media (prefers-color-scheme: dark) {
      h1 .ify { background: linear-gradient(135deg, #A5B4FC, #D8B4FE); -webkit-background-clip: text; background-clip: text; }
    }
    .label {
      margin: 0 0 6px;
      font-weight: 600;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .themes {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .themes label {
      flex: 1;
      text-align: center;
      padding: 6px 0;
      cursor: pointer;
      background: var(--surface);
    }
    .themes label + label { border-left: 1px solid var(--border); }
    .themes input { position: absolute; opacity: 0; pointer-events: none; }
    .themes label:has(input:checked) {
      background: var(--brand);
      color: #ffffff;
      font-weight: 600;
    }
    .themes label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
    .status {
      margin-top: 14px;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
    }
    .status.warn {
      background: var(--warn-bg);
      border-color: var(--warn-border);
    }
    .status p { margin: 0 0 8px; }
    .status p:last-child { margin-bottom: 0; }
    button {
      font: inherit;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    .tip { margin: 12px 0 0; color: var(--muted); font-size: 12px; }
    kbd { display: inline-block; min-width: 16px; padding: 0 5px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; background: var(--surface); color: var(--fg); font: 600 11px/1.5 Consolas, monospace; text-align: center; }
  </style>
</head>
<body>
  <h1><img src="icons/logo.svg" alt=""><span>MD<span class="ify">ify</span></span></h1>

  <p class="label">Theme</p>
  <div class="themes" role="radiogroup" aria-label="Theme">
    <label><input type="radio" name="theme" value="auto">Auto</label>
    <label><input type="radio" name="theme" value="light">Light</label>
    <label><input type="radio" name="theme" value="dark">Dark</label>
  </div>

  <div class="status" id="status"></div>

  <p class="tip">Tip: press <kbd>?</kbd> on any Markdown page for keyboard shortcuts, or use the <strong>Aa</strong> button for text size, font and width.</p>

  <script src="popup.js"></script>
</body>
</html>
